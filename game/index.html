<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Meridian Job — a tiny heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e16; }
  #game { position: fixed; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Meridian Job: sneak past guards and cameras, steal the Aurora Diamond and reach the exit"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
